aid: magentic

name: Magentic

description: 'Magentic builds AI agents that automate procurement and supply‑chain processes for global manufacturers. Their platform integrates with enterprise data, platforms and intelligence to create digital workers that handle sourcing, pricing, and spend management. Backed by Sequoia Capital, Magentic has raised $18 million to expand its AI workforce for the physical world, serving customers like Siemens and other AI‑forward enterprises. The company focuses on secure, scalable AI solutions across industries, offering capabilities in procurement automation, spend analytics, and AI‑driven decision support.'

